services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-30}
      APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?Set APPROVAL_SIGNING_SECRET in .env}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ANOMALY_THRESHOLD_SECONDS: ${ANOMALY_THRESHOLD_SECONDS:-60}
      SEED_APPROVER_EMAIL: ${SEED_APPROVER_EMAIL:-approver@example.com}
      SEED_APPROVER_PASSWORD: ${SEED_APPROVER_PASSWORD:?Set SEED_APPROVER_PASSWORD in .env}
      SEED_VIEWER_EMAIL: ${SEED_VIEWER_EMAIL:-viewer@example.com}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:?Set SEED_VIEWER_PASSWORD in .env}
    command: sh -c "cd /app && alembic -c /app/backend/alembic.ini upgrade head && python -m app.seed && uvicorn app.main:app --app-dir /app/backend --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
